<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal Convert — Right-click. Convert. Done.</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0f0f12;
        color: #e8e8e8;
        font-family: 'Inter', system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }
      .container {
        max-width: 1920px;
        width: 100%;
        text-align: center;
      }
      video {
        width: 100%;
        max-width: 100%;
        border-radius: 12px;
        box-shadow: 0 24px 70px rgba(0,0,0,0.55);
        background: #0f0f12;
      }
      h1 {
        font-size: clamp(2rem, 5vw, 4rem);
        font-weight: 900;
        letter-spacing: -0.02em;
        margin: 24px 0 8px;
      }
      .tagline {
        font-size: clamp(1rem, 2.5vw, 1.5rem);
        color: #a0a0a8;
        font-weight: 400;
      }
      .tagline .accent { color: #67e480; }
      .meta {
        margin-top: 16px;
        font-size: 0.875rem;
        color: #777;
      }
      a { color: #67e480; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <video src="brag.mp4" poster="brag.jpg" controls autoplay loop muted playsinline preload="metadata"></video>
      <h1>Universal Convert</h1>
      <p class="tagline"><span class="accent">Right-click.</span> Convert. <span class="accent">Done.</span></p>
      <p class="meta">
        Select files → right-click → <strong>Convert With…</strong> → pick action → done.
        <br />
        Images, PDFs, Office docs. Batch resize, compress, merge, split, convert.
        <br />
        <a href="https://github.com/harmless-beep/universal-convert/releases">Download</a> · <a href="https://github.com/harmless-beep/universal-convert">Source</a>
      </p>
    </div>
  </body>
</html>
